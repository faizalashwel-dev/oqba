name: oqba
description: 100% Offline PDF Scanner & Toolkit
version: 1.0.0+1

publish_to: 'none'

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_mlkit_document_scanner: ^0.4.1
  syncfusion_flutter_pdf: ^28.1.33
  syncfusion_flutter_pdfviewer: ^28.1.33
  path_provider: ^2.1.4
  file_picker: ^8.0.0
  permission_handler: ^11.3.0
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
